[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-the-ref"
version = "0.1.0"
description = "Current football rules with verifiable section citations"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7", "psycopg[binary]>=3.2,<4", "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
ref-sources = "ask_the_ref.download:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
